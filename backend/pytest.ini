[pytest]
testpaths = tests
pythonpath = .
addopts = -q -p no:cacheprovider
filterwarnings =
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
markers =
    unit: fast tests of one function/class with fakes, no HTTP
    integration: requests through the FastAPI app (router -> service -> repository) with in-memory Supabase
